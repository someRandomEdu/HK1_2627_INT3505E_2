openapi: 3.1.0

info:
    title: Tasks API
    version: 1.0.0
    description: API Tasks nội bộ

paths:
    /tasks:
        get:
            description: Lấy danh sách các Task

            parameters:
            -   in: query
                name: page

                schema:
                    type: integer

            -   in: query
                name: offset

                schema:
                    type: integer

            responses:
                "200":
                    description: OK
                    
                    content:
                        application/json:
                            schema:
                                type: array
                                
                                items:
                                    type: object

                                    properties:
                                        id:
                                            type: integer
                                            format: int32
                            
                                        status:
                                            type: boolean

                                        from:
                                            type: string
                                            format: date-time

                                        until:
                                            type: string
                                            format: date-time
                                        
                                        content:
                                            type: string

        post:
            description: Thêm một Task mới

            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/Task"
    
    /tasks/{taskId}:
        get:
            description: Lấy thông tin của một task nhất định
            
            parameters:
            -   $ref: "#/components/parameters/taskId"

            responses:
                "200":
                    description: Ok

                    content:
                        application/json:
                            schema:
                                type: object

                                properties:
                                    id:
                                        type: string
                                    
                                    done:
                                        type: boolean

                                    description:
                                        type: string

                                    from:
                                        type: string
                                        format: date-time

                                    to:
                                        type: string
                                        format: date-time

                "404":
                    description: Không tìm thấy task!

        put:
            description: Thay đổi thông tin một Task

            parameters:
            -   $ref: "#/components/parameters/taskId"

            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/Task"

            responses:
                "201":
                    description: Thay đổi Task thành công!

                "404":
                    description: Không tìm thấy Task!

        delete:
            description: Xóa một Task
            
            parameters:
            -   $ref: "#/components/parameters/taskId"

            responses:
                "204":
                    description: Ok

                "404":
                    description: Không tìm thấy Task với taskId đó!

components: 
    parameters:
        taskId:
            name: taskId
            in: path
            description: Id
            required: true

            schema:
                type: string

    schemas:
        Task:
            properties:
                content:
                    type: string
                
                until:
                    type: string
                    format: date-time
